# AMBIENTE
app.environment=mongo
# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# LOG
logging.level.root=INFO
logging.level.com.example.spring_course=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.mongodb.uri=${SPRING_DATASOURCE_URL_MONGO:mongodb://root:root@localhost:27017/spring_course?authSource=admin}

spring.flyway.enabled=false
spring.liquibase.enabled=false