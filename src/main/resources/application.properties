# APPLICATION
spring.application.name=spring-course
# DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/local_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# SERVER
server.port=8080
# Caching / Scheduling / Async
app.scheduler.product-stats.fixed-rate=${APP_SCHEDULER_PRODUCT_STATS_FIXED_RATE:60000}
app.scheduler.product-stats.initial-delay=${APP_SCHEDULER_PRODUCT_STATS_INITIAL_DELAY:10000}